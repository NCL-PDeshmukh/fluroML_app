name: fluroml
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pandas=1.5.3
  - numpy=1.23.5
  - scikit-learn=1.2.2
  - rdkit=2023.03.1  # ✅ Official conda version (not rdkit-pypi)
  - pip
  - pip:
      - streamlit==1.25.0
      - deepchem==2.8.0   # ✅ Supports Python 3.10
      - joblib==1.3.1
      - pillow==9.5.0
      - matplotlib==3.7.1
