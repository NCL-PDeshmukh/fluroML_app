# Conda environment for FluroML
# Fixes the Python version and installs the pinned dependencies from requirements.txt.
#
#   conda env create -f environment.yml
#   conda activate fluroml
#
# Python 3.11 matches .devcontainer/devcontainer.json
# (mcr.microsoft.com/devcontainers/python:1-3.11-bookworm)

name: fluroml

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip

  # System libraries RDKit needs for molecule rendering.
  # These mirror .streamlit/packages.txt (libxrender1, libsm6, libxext6).
  - xorg-libxrender
  - xorg-libsm
  - xorg-libxext

  - pip:
      - streamlit==1.27.0
      - streamlit-ketcher==0.0.1
      - numpy==1.23.5
      - pandas==1.5.3
      - joblib==1.2.0
      - deepchem==2.8.0
      - scikit-learn==1.1.2
      - rdkit-pypi==2023.3.1b1
      - pillow==9.5.0
      - matplotlib==3.7.1
