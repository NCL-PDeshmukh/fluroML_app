name: fluroml_env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - rdkit=2024.03.1       # RDKit latest release (Jan–Mar 2024)
  - deepchem=2.7.1
  - numpy=1.23.5
  - pandas=1.5.3
  - scikit-learn=1.1.2
  - matplotlib=3.7.1
  - pillow=9.5.0          # Compatible with Streamlit <10
  - pip                  # for additional pip packages
  - pip:
      - streamlit==1.31.0
      - joblib==1.3.1
      - tensorflow==2.13.0   # required for DeepChem models
      - torch==2.0.1          # enables DeepChem + PyTorch support
      - torchvision==0.15.2
      - rdkit-pypi==2022.9.5  # (optional) pip build if conda fails
